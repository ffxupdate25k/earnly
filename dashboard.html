<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Earnly Dashboard</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
</head>
<body>

<div class="container">

<div class="top">
  <div>
    <small>Welcome Back</small>
    <h2 id="name">User</h2>
  </div>
  <div class="coin" id="currency">NGN</div>
</div>

<div class="balance-card">
  <small>Available Balance</small>
  <h1 id="balance">0.00</h1>
</div>

<div class="grid">
  <a href="#"><div class="menu">👥<br>Referral</div></a>
  <a href="#"><div class="menu">📋<br>Tasks</div></a>
  <a href="#"><div class="menu">💸<br>Withdrawal</div></a>
  <a href="#"><div class="menu">📜<br>History</div></a>
</div>

<a href="#"><div class="support">💬 Telegram Support</div></a>

<div id="adminBtn" style="display:none;margin-top:15px;">
<button>🛠 Admin Panel</button>
</div>

</div>

<div class="bottom">
  <div class="active">🏠<br>Home</div>
  <div>📋<br>Tasks</div>
  <div>💸<br>Withdraw</div>
  <div>👤<br>Profile</div>
</div>

<script src="js/dashboard.js"></script>

</body>
</html>
